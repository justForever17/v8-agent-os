name: Desktop Preview Build

on:
  workflow_call:
    inputs:
      targets_json:
        description: JSON array of desktop target ids selected by the release planner
        required: false
        default: "[]"
        type: string
      platform:
        description: Single desktop target used by compatibility callers
        required: false
        default: all
        type: string
      release_version:
        description: Canonical release version used to name build artifacts
        required: false
        default: ""
        type: string
      release_channel:
        description: Canonical release channel
        required: false
        default: preview
        type: string
      release_tag:
        description: Canonical or compatibility release tag
        required: false
        default: ""
        type: string
  workflow_dispatch:
    inputs:
      platform:
        description: Desktop target platform
        required: true
        default: all
        type: choice
        options:
          - windows-x64
          - windows-arm64
          - macos-x64
          - macos-arm64
          - linux-x64
          - linux-arm64
          - all

permissions:
  contents: read

# GitHub-hosted macOS runners occasionally time out while a cold npm cache is
# downloading a transitive package.  Keep package installation deterministic,
# but make the transport retry budget explicit instead of treating that
# transient registry failure as a product-build failure.
env:
  NPM_CONFIG_FETCH_RETRIES: "5"
  NPM_CONFIG_FETCH_RETRY_FACTOR: "2"
  NPM_CONFIG_FETCH_RETRY_MINTIMEOUT: "10000"
  NPM_CONFIG_FETCH_RETRY_MAXTIMEOUT: "120000"
  NPM_CONFIG_FETCH_TIMEOUT: "300000"

concurrency:
  # Dispatches for different native targets are independent.  Keep same-target
  # reruns cancellable, but never let an arm64 request cancel x64 or Linux.
  group: desktop-preview-${{ github.workflow }}-${{ github.ref }}-${{ inputs.targets_json || inputs.platform || 'all' }}
  cancel-in-progress: ${{ inputs.release_tag == '' }}

jobs:
  resolve-desktop-platforms:
    name: Resolve desktop build targets
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read
    outputs:
      enabled: ${{ steps.targets.outputs.enabled }}
      matrix: ${{ steps.targets.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: targets
        name: Resolve requested platforms
        shell: bash
        env:
          V8OS_DESKTOP_PLATFORM: ${{ inputs.platform || 'all' }}
          V8OS_DESKTOP_TARGETS_JSON: ${{ inputs.targets_json || '[]' }}
        run: >-
          node scripts/desktop/resolve-desktop-build-matrix.mjs
          --event "$GITHUB_EVENT_NAME"
          --platform "$V8OS_DESKTOP_PLATFORM"
          --targets-json "$V8OS_DESKTOP_TARGETS_JSON"
          --github-output "$GITHUB_OUTPUT"

  desktop-package:
    name: ${{ matrix.label }}
    needs:
      - resolve-desktop-platforms
    if: needs.resolve-desktop-platforms.outputs.enabled == 'true'
    runs-on: ${{ matrix.runner }}
    timeout-minutes: ${{ matrix.id == 'windows-arm64' && 180 || 120 }}
    permissions:
      contents: read
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(needs.resolve-desktop-platforms.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Verify target runner architecture
        if: runner.os != 'Windows'
        shell: bash
        run: |
          set -euo pipefail
          case "${{ matrix.arch }}" in
            x64) test "$(uname -m)" = "x86_64" ;;
            arm64) test "$(uname -m)" = "arm64" || test "$(uname -m)" = "aarch64" ;;
          esac

      - name: Install Linux desktop runtime build dependencies
        if: matrix.os == 'linux'
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          GI_DEV="libgirepository-2.0-dev"
          if ! apt-cache show "$GI_DEV" >/dev/null 2>&1; then GI_DEV="libgirepository1.0-dev"; fi
          sudo apt-get install -y \
            build-essential pkg-config meson ninja-build xz-utils \
            "$GI_DEV" gobject-introspection libglib2.0-dev libcairo2-dev libffi-dev \
            gir1.2-atspi-2.0 at-spi2-core \
            dbus-x11 gnome-keyring libpam-gnome-keyring libsecret-tools xvfb xauth \
            xdotool wmctrl xclip xsel \
            libgtk-3-0 libnotify4 libnss3 libxss1 libxtst6 xdg-utils

      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            packages/product-ui/package-lock.json
            packages/session-realtime/package-lock.json
            apps/v8-agent-os-admin/package-lock.json
            apps/v8-agent-os-web/package-lock.json
            apps/v8-agent-os-desktop-pet/package-lock.json
            apps/v8-agent-os-shell/package-lock.json

      - name: Verify Windows runner and Node architecture
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $processor = Get-CimInstance Win32_Processor | Select-Object -First 1
          $hostArchitecture = switch ([int]$processor.Architecture) {
            9 { "x64" }
            12 { "arm64" }
            default { "unknown-$($processor.Architecture)" }
          }
          $expectedArchitecture = "${{ matrix.arch }}"
          if ($hostArchitecture -ne $expectedArchitecture) {
            throw "Windows host architecture mismatch: expected $expectedArchitecture, got $hostArchitecture"
          }
          node -e "if (process.arch !== '$expectedArchitecture') { throw new Error('Node architecture mismatch: expected $expectedArchitecture, got ' + process.arch) }"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: ${{ matrix.id == 'windows-arm64' && '1.92.0' || 'stable' }}

      - name: Verify Windows Rust native target
        if: matrix.os == 'windows'
        shell: pwsh
        run: |
          $rustHost = (& rustc -vV | Select-String '^host:' | Select-Object -First 1 | ForEach-Object { $_.Line -replace '^host:\s*', '' })
          $expectedRustHost = if ("${{ matrix.arch }}" -eq "arm64") { "aarch64-pc-windows-msvc" } else { "x86_64-pc-windows-msvc" }
          if ($rustHost -ne $expectedRustHost) {
            throw "Rust host mismatch: expected $expectedRustHost, got $rustHost"
          }

      - name: Prepare embedded Engine Python runtime on Windows
        if: matrix.os == 'windows'
        shell: pwsh
        timeout-minutes: ${{ matrix.id == 'windows-arm64' && 110 || 60 }}
        run: |
          scripts/desktop/prepare-windows-python-runtime.ps1 `
            -PythonVersion 3.11.9 `
            -Architecture "${{ matrix.pythonArch }}" `
            -RequirementsPath apps/v8-agent-os-engine/requirements/desktop-preview.txt `
            -SkipPlaywrightBrowsers

      - name: Prepare embedded Engine Python runtime on macOS or Linux
        if: matrix.os != 'windows'
        shell: bash
        timeout-minutes: 45
        run: |
          node scripts/desktop/prepare-posix-python-runtime.mjs \
            --target "${{ matrix.id }}" \
            --requirements-path apps/v8-agent-os-engine/requirements/desktop-preview.txt \
            --skip-playwright-browsers

      - name: Build and verify shared Product UI package
        working-directory: packages/product-ui
        timeout-minutes: 8
        run: npm ci --include=dev --workspaces=false

      - name: Verify shared Product UI archive
        timeout-minutes: 3
        run: node scripts/desktop/verify-product-ui-package.mjs --verify-build

      - name: Install shared realtime package dependencies
        working-directory: packages/session-realtime
        timeout-minutes: 8
        run: |
          npm ci --include=dev --workspaces=false
          npm exec -- tsc --version
          npm run build

      - name: Install Admin dependencies
        working-directory: apps/v8-agent-os-admin
        timeout-minutes: 8
        run: npm ci --include=dev --workspaces=false

      - name: Install Web dependencies
        working-directory: apps/v8-agent-os-web
        timeout-minutes: 8
        run: npm ci --include=dev --workspaces=false

      - name: Install desktop pet dependencies
        working-directory: apps/v8-agent-os-desktop-pet
        timeout-minutes: 8
        run: npm ci --include=dev --workspaces=false

      - name: Install Shell dependencies
        working-directory: apps/v8-agent-os-shell
        timeout-minutes: 8
        run: npm ci --include=dev --workspaces=false

      - name: Build native engineering sandbox host
        timeout-minutes: 10
        run: node scripts/desktop/build-sandbox-host.mjs --force

      - name: Build Admin and Web production bundles
        timeout-minutes: 25
        run: |
          node scripts/run-next-with-managed-auth.mjs --app admin --mode build --port 9528
          node scripts/run-next-with-managed-auth.mjs --app web --mode build --port 9527

      - name: Build desktop pet
        working-directory: apps/v8-agent-os-desktop-pet
        timeout-minutes: 10
        run: |
          npm exec -- vite --version
          npm exec -- esbuild --version
          npm run build

      - name: Build packaged macOS AX sidecar
        if: matrix.os == 'macos'
        shell: bash
        timeout-minutes: 5
        run: node scripts/desktop/build-macos-ax-helper.mjs

      - name: Verify desktop runtime payload
        timeout-minutes: 8
        run: node apps/v8-agent-os-shell/tests/scripts/verify_desktop_release_runtime.mjs

      - name: Shell release contract tests
        timeout-minutes: 10
        run: npm --prefix apps/v8-agent-os-shell test

      - name: Generate macOS application icon
        if: matrix.os == 'macos'
        shell: bash
        timeout-minutes: 3
        run: node scripts/desktop/prepare-macos-icon.mjs

      - name: Build unsigned Windows desktop preview
        if: matrix.os == 'windows'
        shell: pwsh
        timeout-minutes: 30
        run: npm --prefix apps/v8-agent-os-shell run dist:win:preview -- --${{ matrix.arch }}

      - name: Build unsigned macOS desktop preview
        if: matrix.os == 'macos'
        shell: bash
        timeout-minutes: 35
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
        run: npm --prefix apps/v8-agent-os-shell run dist:mac:preview -- --${{ matrix.arch }}

      - name: Build unsigned Linux desktop preview
        if: matrix.os == 'linux'
        shell: bash
        timeout-minutes: 35
        run: npm --prefix apps/v8-agent-os-shell run dist:linux:preview -- --${{ matrix.arch }}

      - name: Install Linux desktop preview package
        if: matrix.os == 'linux'
        shell: bash
        timeout-minutes: 5
        run: |
          set -euo pipefail
          mapfile -t deb_paths < <(find apps/v8-agent-os-shell/dist/release -maxdepth 1 -type f -name '*.deb' -print)
          test "${#deb_paths[@]}" -eq 1
          deb_path="${deb_paths[0]}"
          case "${{ matrix.arch }}" in
            x64) expected_deb_arch="amd64" ;;
            arm64) expected_deb_arch="arm64" ;;
            *) echo "Unsupported Linux package architecture: ${{ matrix.arch }}" >&2; exit 1 ;;
          esac
          test "$(dpkg-deb -f "$deb_path" Architecture)" = "$expected_deb_arch"
          sudo dpkg -i "$deb_path"
          test -x "/opt/V8 Agent OS/v8-agent-os-shell"

      - name: Installed Linux desktop smoke
        if: matrix.os == 'linux'
        shell: bash
        timeout-minutes: 8
        env:
          V8_AGENT_OS_HOME: ${{ runner.temp }}/v8os-linux-smoke-${{ matrix.arch }}
          V8OS_SHELL_EXE: /opt/V8 Agent OS/v8-agent-os-shell
          V8OS_DISABLE_UPDATE_CHECK: '1'
        run: |
          set -euo pipefail
          export XDG_DATA_HOME="$V8_AGENT_OS_HOME/xdg-data"
          export XDG_CONFIG_HOME="$V8_AGENT_OS_HOME/xdg-config"
          export XDG_RUNTIME_DIR="$V8_AGENT_OS_HOME/xdg-runtime"
          mkdir -p "$XDG_DATA_HOME" "$XDG_CONFIG_HOME" "$XDG_RUNTIME_DIR"
          chmod 700 "$XDG_RUNTIME_DIR"
          export V8OS_SMOKE_KEYRING_PASSWORD="$(openssl rand -hex 32)"
          export V8OS_CREDENTIAL_PROBE="$V8_AGENT_OS_HOME/credential-smoke.py"
          cat >"$V8OS_CREDENTIAL_PROBE" <<'PY'
          import secrets

          from core.security.credentials import CredentialRefStore, LinuxSecretServiceCredentialBackend

          store = CredentialRefStore(LinuxSecretServiceCredentialBackend())
          reference = f"cred:v8-system:release-smoke-{secrets.token_hex(12)}"
          value = secrets.token_urlsafe(32)
          try:
              assert store.put(value, reference=reference, namespace="system") == reference
              assert store.resolve(reference) == value
              assert store.delete(reference) is True
              assert store.status(reference).configured is False
          finally:
              try:
                  store.delete(reference)
              except Exception:
                  pass
          print("V8OS_LINUX_SECRET_SERVICE_OK")
          PY
          dbus-run-session -- bash -euo pipefail -c '
            keyring_env="$V8_AGENT_OS_HOME/keyring.env"
            printf "%s" "$V8OS_SMOKE_KEYRING_PASSWORD" \
              | gnome-keyring-daemon --unlock --components=secrets >"$keyring_env"
            while IFS= read -r entry; do
              case "$entry" in
                GNOME_KEYRING_CONTROL=*|SSH_AUTH_SOCK=*) export "$entry" ;;
              esac
            done <"$keyring_env"
            engine_root="/opt/V8 Agent OS/resources/v8os/apps/v8-agent-os-engine"
            engine_python="$engine_root/.python/bin/python3"
            test -x "$engine_python"
            (cd "$engine_root" && PYTHONPATH="$engine_root" "$engine_python" "$V8OS_CREDENTIAL_PROBE")
            xvfb-run -a node apps/v8-agent-os-shell/tests/scripts/run_desktop_install_smoke.mjs \
              --shell-exe "$V8OS_SHELL_EXE" \
              --timeout-ms 90000 \
              --startup-budget-ms 90000
          '

      - name: Print Linux desktop smoke service logs
        if: failure() && matrix.os == 'linux'
        shell: bash
        env:
          V8_AGENT_OS_HOME: ${{ runner.temp }}/v8os-linux-smoke-${{ matrix.arch }}
        run: |
          log_dir="${V8_AGENT_OS_HOME:-$HOME/.v8-agent-os}/logs/cli"
          if [[ -d "$log_dir" ]]; then
            while IFS= read -r log_file; do
              echo "--- $(basename "$log_file") (last 200 lines) ---"
              tail -n 200 "$log_file"
            done < <(find "$log_dir" -maxdepth 1 -type f -name '*.log' -print)
          fi

      - name: Cleanup Linux desktop smoke processes
        if: always() && matrix.os == 'linux'
        shell: bash
        env:
          V8_AGENT_OS_HOME: ${{ runner.temp }}/v8os-linux-smoke-${{ matrix.arch }}
        run: |
          set -euo pipefail
          shell_exe="/opt/V8 Agent OS/v8-agent-os-shell"
          resource_root="/opt/V8 Agent OS/resources/v8os"
          installed_cli="$resource_root/apps/v8-agent-os-cli/bin/v8os.mjs"
          if [[ -f "$installed_cli" ]]; then
            ELECTRON_RUN_AS_NODE=1 \
            V8OS_SHELL_PACKAGED=1 \
            V8_REPO_ROOT="$resource_root" \
              "$shell_exe" "$installed_cli" stop --all
          fi
          pkill -TERM -f '^/opt/V8 Agent OS/v8-agent-os-shell($| )' || true
          node apps/v8-agent-os-shell/tests/scripts/verify_desktop_cleanup.mjs \
            --state-root "$V8_AGENT_OS_HOME"

      - name: Read-only AppImage desktop smoke
        if: matrix.os == 'linux'
        shell: bash
        timeout-minutes: 8
        env:
          V8_AGENT_OS_HOME: ${{ runner.temp }}/v8os-appimage-smoke-${{ matrix.arch }}
          V8OS_DISABLE_UPDATE_CHECK: '1'
        run: |
          set -euo pipefail
          export V8_CHECKPOINT_AES_KEY="$(openssl rand -hex 32)"
          appimage="$(realpath "$(find apps/v8-agent-os-shell/dist/release -maxdepth 1 -type f -name '*-${{ matrix.arch }}.AppImage' -print -quit)")"
          work_root="$RUNNER_TEMP/v8os-appimage-${{ matrix.arch }}"
          rm -rf "$work_root"
          mkdir -p "$work_root"
          (cd "$work_root" && "$appimage" --appimage-extract >/dev/null)
          package_root="$work_root/squashfs-root"
          app_run="$package_root/AppRun"
          shell_exe="$package_root/v8-agent-os-shell"
          resource_root="$package_root/resources/v8os"
          test -x "$app_run"
          test -x "$shell_exe"
          chmod -R a-w "$package_root"
          dbus-run-session -- xvfb-run -a node apps/v8-agent-os-shell/tests/scripts/run_desktop_install_smoke.mjs \
            --shell-exe "$app_run" \
            --resource-root "$resource_root" \
              --timeout-ms 90000 \
              --startup-budget-ms 90000

      - name: Cleanup read-only AppImage desktop smoke
        if: always() && matrix.os == 'linux'
        shell: bash
        env:
          V8_AGENT_OS_HOME: ${{ runner.temp }}/v8os-appimage-smoke-${{ matrix.arch }}
        run: |
          set -euo pipefail
          work_root="$RUNNER_TEMP/v8os-appimage-${{ matrix.arch }}"
          package_root="$work_root/squashfs-root"
          app_run="$package_root/AppRun"
          shell_exe="$package_root/v8-agent-os-shell"
          resource_root="$package_root/resources/v8os"
          installed_cli="$resource_root/apps/v8-agent-os-cli/bin/v8os.mjs"
          if [[ -x "$app_run" && -f "$installed_cli" ]]; then
            ELECTRON_RUN_AS_NODE=1 \
            V8OS_SHELL_PACKAGED=1 \
            V8_REPO_ROOT="$resource_root" \
              "$app_run" "$installed_cli" stop --all
          fi
          pkill -TERM -f "^$shell_exe($| )" || true
          node apps/v8-agent-os-shell/tests/scripts/verify_desktop_cleanup.mjs \
            --state-root "$V8_AGENT_OS_HOME"
          if [[ -d "$package_root" ]]; then chmod -R u+w "$package_root"; fi
          rm -rf "$work_root"

      - name: Collect Linux desktop smoke diagnostics
        if: failure() && matrix.os == 'linux'
        shell: bash
        env:
          V8_AGENT_OS_HOME: ${{ runner.temp }}/v8os-linux-smoke-${{ matrix.arch }}
        run: |
          diag="desktop-smoke-diagnostics-${{ matrix.id }}"
          mkdir -p "$diag"
          for state_root in \
            "${V8_AGENT_OS_HOME:-$HOME/.v8-agent-os}" \
            "$RUNNER_TEMP/v8os-appimage-smoke-${{ matrix.arch }}"; do
            surface="$(basename "$state_root")"
            [[ ! -d "$state_root/reports/desktop_release" ]] \
              || cp -R "$state_root/reports/desktop_release" "$diag/reports-$surface"
            [[ ! -d "$state_root/logs" ]] || cp -R "$state_root/logs" "$diag/logs-$surface"
          done
        continue-on-error: true

      - name: Upload Linux desktop smoke diagnostics
        if: failure() && matrix.os == 'linux'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v8os-desktop-smoke-diagnostics-${{ matrix.id }}
          path: desktop-smoke-diagnostics-${{ matrix.id }}/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
        continue-on-error: true

      - name: Installed Windows desktop smoke
        if: matrix.os == 'windows'
        shell: pwsh
        timeout-minutes: 8
        env:
          V8_AGENT_OS_HOME: ${{ runner.temp }}/v8os-windows-smoke-${{ matrix.arch }}
          V8OS_WINDOWS_INSTALL_DIR: ${{ runner.temp }}/v8os-windows-install-${{ matrix.arch }}
          V8OS_DISABLE_UPDATE_CHECK: '1'
        run: |
          $installers = @(Get-ChildItem "apps/v8-agent-os-shell/dist/release" -File -Filter "*-win-${{ matrix.arch }}.exe")
          if ($installers.Count -ne 1) { throw "Expected exactly one Windows ${{ matrix.arch }} installer, found $($installers.Count)" }
          $installer = $installers[0]
          $env:V8_AGENT_OS_HOME = [IO.Path]::GetFullPath($env:V8_AGENT_OS_HOME)
          $env:V8OS_WINDOWS_INSTALL_DIR = [IO.Path]::GetFullPath($env:V8OS_WINDOWS_INSTALL_DIR)
          if ($env:V8OS_WINDOWS_INSTALL_DIR.Contains("/")) { throw "Windows install directory was not normalized" }
          New-Item -ItemType Directory -Force -Path $env:V8OS_WINDOWS_INSTALL_DIR | Out-Null
          $install = Start-Process -FilePath $installer.FullName -ArgumentList @("/S", "/D=$env:V8OS_WINDOWS_INSTALL_DIR") -Wait -PassThru -WindowStyle Hidden
          if ($install.ExitCode -ne 0) { throw "Windows installer exited with code $($install.ExitCode)" }
          $shellExe = Get-Item (Join-Path $env:V8OS_WINDOWS_INSTALL_DIR "V8 Agent OS.exe") -ErrorAction Stop
          $resourceRoot = Join-Path $shellExe.Directory.FullName "resources\v8os"
          $engineRoot = Join-Path $resourceRoot "apps\v8-agent-os-engine"
          $enginePython = Join-Path $engineRoot ".python\python.exe"
          if (-not (Test-Path -LiteralPath $enginePython -PathType Leaf)) { throw "Installed Engine Python is missing: $enginePython" }
          New-Item -ItemType Directory -Force -Path $env:V8_AGENT_OS_HOME | Out-Null
          $credentialProbe = Join-Path $env:V8_AGENT_OS_HOME "credential-smoke.py"
          @'
          import secrets

          from core.security.credentials import CredentialRefStore, WindowsCredentialBackend

          store = CredentialRefStore(WindowsCredentialBackend())
          reference = f"cred:v8-system:release-smoke-{secrets.token_hex(12)}"
          value = secrets.token_urlsafe(32)
          try:
              assert store.put(value, reference=reference, namespace="system") == reference
              assert store.resolve(reference) == value
              assert store.delete(reference) is True
              assert store.status(reference).configured is False
          finally:
              try:
                  store.delete(reference)
              except Exception:
                  pass
          print("V8OS_WINDOWS_CREDENTIAL_MANAGER_OK")
          '@ | Set-Content -LiteralPath $credentialProbe -Encoding utf8
          $previousPythonPath = $env:PYTHONPATH
          try {
            $env:PYTHONPATH = $engineRoot
            Push-Location $engineRoot
            & $enginePython -X utf8 $credentialProbe
            if ($LASTEXITCODE -ne 0) { throw "Windows Credential Manager probe failed with code $LASTEXITCODE" }
          } finally {
            Pop-Location
            $env:PYTHONPATH = $previousPythonPath
            Remove-Item -LiteralPath $credentialProbe -Force -ErrorAction SilentlyContinue
          }
          node apps/v8-agent-os-shell/tests/scripts/run_desktop_install_smoke.mjs --shell-exe "$($shellExe.FullName)"

      - name: Print Windows desktop smoke service logs
        if: failure() && matrix.os == 'windows'
        shell: pwsh
        env:
          V8_AGENT_OS_HOME: ${{ runner.temp }}/v8os-windows-smoke-${{ matrix.arch }}
        run: |
          $logDir = Join-Path $env:V8_AGENT_OS_HOME "logs\cli"
          if (Test-Path $logDir) {
            Get-ChildItem $logDir -File -Filter "*.log" | ForEach-Object {
              Write-Host "--- $($_.Name) (last 200 lines) ---"
              Get-Content -LiteralPath $_.FullName -Tail 200
            }
          }

      - name: Cleanup Windows desktop smoke processes
        if: always() && matrix.os == 'windows'
        shell: pwsh
        env:
          V8_AGENT_OS_HOME: ${{ runner.temp }}/v8os-windows-smoke-${{ matrix.arch }}
          V8OS_WINDOWS_INSTALL_DIR: ${{ runner.temp }}/v8os-windows-install-${{ matrix.arch }}
        run: |
          $env:V8_AGENT_OS_HOME = [IO.Path]::GetFullPath($env:V8_AGENT_OS_HOME)
          $env:V8OS_WINDOWS_INSTALL_DIR = [IO.Path]::GetFullPath($env:V8OS_WINDOWS_INSTALL_DIR)
          $shellExe = Get-Item (Join-Path $env:V8OS_WINDOWS_INSTALL_DIR "V8 Agent OS.exe") -ErrorAction SilentlyContinue
          if (-not $shellExe) { throw "Installed Windows Shell is missing: $env:V8OS_WINDOWS_INSTALL_DIR" }
          $resourceRoot = Join-Path $shellExe.Directory.FullName "resources\v8os"
          $installedCli = Join-Path $resourceRoot "apps\v8-agent-os-cli\bin\v8os.mjs"
          if (-not (Test-Path -LiteralPath $installedCli -PathType Leaf)) { throw "Installed V8OS CLI is missing: $installedCli" }
          $env:ELECTRON_RUN_AS_NODE = "1"
          $env:V8OS_SHELL_PACKAGED = "1"
          $env:V8_REPO_ROOT = $resourceRoot
          & $shellExe.FullName $installedCli stop --all
          $cliExitCode = $LASTEXITCODE
          Remove-Item Env:ELECTRON_RUN_AS_NODE -ErrorAction SilentlyContinue
          Remove-Item Env:V8OS_SHELL_PACKAGED -ErrorAction SilentlyContinue
          Remove-Item Env:V8_REPO_ROOT -ErrorAction SilentlyContinue
          if ($cliExitCode -ne 0) { throw "Installed V8OS CLI stop --all exited with code $cliExitCode" }
          Get-Process "V8 Agent OS" -ErrorAction SilentlyContinue | Stop-Process -Force
          $uninstallers = @(Get-ChildItem $env:V8OS_WINDOWS_INSTALL_DIR -File -Filter "Uninstall*.exe" -ErrorAction SilentlyContinue)
          if ($uninstallers.Count -ne 1) { throw "Expected exactly one NSIS uninstaller, found $($uninstallers.Count)" }
          $uninstall = Start-Process -FilePath $uninstallers[0].FullName -ArgumentList "/S" -Wait -PassThru -WindowStyle Hidden
          if ($uninstall.ExitCode -ne 0) { throw "Windows uninstaller exited with code $($uninstall.ExitCode)" }
          $uninstallDeadline = [DateTime]::UtcNow.AddSeconds(20)
          while ((Test-Path -LiteralPath $env:V8OS_WINDOWS_INSTALL_DIR) -and [DateTime]::UtcNow -lt $uninstallDeadline) {
            Start-Sleep -Milliseconds 250
          }
          if (Test-Path -LiteralPath $env:V8OS_WINDOWS_INSTALL_DIR) {
            throw "Windows uninstaller did not remove the installation directory: $env:V8OS_WINDOWS_INSTALL_DIR"
          }
          node apps/v8-agent-os-shell/tests/scripts/verify_desktop_cleanup.mjs --state-root "$env:V8_AGENT_OS_HOME"

      - name: Collect Windows desktop smoke diagnostics
        if: failure() && matrix.os == 'windows'
        shell: pwsh
        env:
          V8_AGENT_OS_HOME: ${{ runner.temp }}/v8os-windows-smoke-${{ matrix.arch }}
        run: |
          $diag = "desktop-smoke-diagnostics"
          New-Item -ItemType Directory -Force -Path $diag | Out-Null
          $v8Home = $env:V8_AGENT_OS_HOME
          if (Test-Path (Join-Path $v8Home "reports\desktop_release")) {
            Copy-Item (Join-Path $v8Home "reports\desktop_release") (Join-Path $diag "reports") -Recurse -Force
          }
          if (Test-Path (Join-Path $v8Home "logs")) {
            Copy-Item (Join-Path $v8Home "logs") (Join-Path $diag "logs") -Recurse -Force
          }
        continue-on-error: true

      - name: Packaged macOS desktop smoke
        if: matrix.os == 'macos'
        shell: bash
        timeout-minutes: 8
        env:
          V8_AGENT_OS_HOME: ${{ runner.temp }}/v8os-macos-smoke-${{ matrix.arch }}
          V8OS_DISABLE_UPDATE_CHECK: '1'
        run: |
          set -euo pipefail
          export V8_CHECKPOINT_AES_KEY="$(openssl rand -hex 32)"
          dmg_path="$(find apps/v8-agent-os-shell/dist/release -maxdepth 1 -type f -name '*-${{ matrix.arch }}.dmg' -print -quit)"
          mount_point="$RUNNER_TEMP/v8os-dmg-${{ matrix.arch }}"
          test -n "$dmg_path"
          mkdir -p "$mount_point"
          hdiutil attach "$dmg_path" -mountpoint "$mount_point" -nobrowse -readonly
          shell_exe="$mount_point/V8 Agent OS.app/Contents/MacOS/V8 Agent OS"
          resource_root="$mount_point/V8 Agent OS.app/Contents/Resources/v8os"
          engine_root="$resource_root/apps/v8-agent-os-engine"
          engine_python="$engine_root/.python/bin/python3"
          mkdir -p "$V8_AGENT_OS_HOME"
          credential_probe="$V8_AGENT_OS_HOME/credential-smoke.py"
          test -x "$shell_exe"
          test -x "$engine_python"
          cat >"$credential_probe" <<'PY'
          import secrets

          from core.security.credentials import CredentialRefStore, MacOSKeychainCredentialBackend

          store = CredentialRefStore(MacOSKeychainCredentialBackend())
          reference = f"cred:v8-system:release-smoke-{secrets.token_hex(12)}"
          value = secrets.token_urlsafe(32)
          try:
              assert store.put(value, reference=reference, namespace="system") == reference
              assert store.resolve(reference) == value
              assert store.delete(reference) is True
              assert store.status(reference).configured is False
          finally:
              try:
                  store.delete(reference)
              except Exception:
                  pass
          print("V8OS_MACOS_KEYCHAIN_OK")
          PY
          (cd "$engine_root" && PYTHONPATH="$engine_root" "$engine_python" "$credential_probe")
          node apps/v8-agent-os-shell/tests/scripts/run_desktop_install_smoke.mjs \
            --shell-exe "$shell_exe" \
              --timeout-ms 90000 \
              --startup-budget-ms 90000

      - name: Cleanup macOS desktop smoke processes
        if: always() && matrix.os == 'macos'
        shell: bash
        env:
          V8_AGENT_OS_HOME: ${{ runner.temp }}/v8os-macos-smoke-${{ matrix.arch }}
        run: |
          set -euo pipefail
          mount_point="$RUNNER_TEMP/v8os-dmg-${{ matrix.arch }}"
          shell_exe="$mount_point/V8 Agent OS.app/Contents/MacOS/V8 Agent OS"
          resource_root="$mount_point/V8 Agent OS.app/Contents/Resources/v8os"
          installed_cli="$resource_root/apps/v8-agent-os-cli/bin/v8os.mjs"
          if [[ -x "$shell_exe" && -f "$installed_cli" ]]; then
            ELECTRON_RUN_AS_NODE=1 \
            V8OS_SHELL_PACKAGED=1 \
            V8_REPO_ROOT="$resource_root" \
              "$shell_exe" "$installed_cli" stop --all
          fi
          pkill -TERM -x 'V8 Agent OS' || true
          node apps/v8-agent-os-shell/tests/scripts/verify_desktop_cleanup.mjs \
            --state-root "$V8_AGENT_OS_HOME"
          hdiutil detach "$mount_point" || hdiutil detach "$mount_point" -force

      - name: Print macOS desktop smoke service logs
        if: failure() && matrix.os == 'macos'
        shell: bash
        env:
          V8_AGENT_OS_HOME: ${{ runner.temp }}/v8os-macos-smoke-${{ matrix.arch }}
        run: |
          log_dir="$V8_AGENT_OS_HOME/logs/cli"
          [[ ! -d "$log_dir" ]] || find "$log_dir" -maxdepth 1 -type f -name '*.log' -print -exec tail -n 200 {} \;
        continue-on-error: true

      - name: Collect macOS desktop smoke diagnostics
        if: failure() && matrix.os == 'macos'
        shell: bash
        env:
          V8_AGENT_OS_HOME: ${{ runner.temp }}/v8os-macos-smoke-${{ matrix.arch }}
        run: |
          diag="desktop-smoke-diagnostics-${{ matrix.id }}"
          mkdir -p "$diag"
          [[ ! -d "$V8_AGENT_OS_HOME/reports/desktop_release" ]] \
            || cp -R "$V8_AGENT_OS_HOME/reports/desktop_release" "$diag/reports"
          [[ ! -d "$V8_AGENT_OS_HOME/logs" ]] || cp -R "$V8_AGENT_OS_HOME/logs" "$diag/logs"
        continue-on-error: true

      - name: Upload macOS desktop smoke diagnostics
        if: failure() && matrix.os == 'macos'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v8os-desktop-smoke-diagnostics-${{ matrix.id }}
          path: desktop-smoke-diagnostics-${{ matrix.id }}/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
        continue-on-error: true

      - name: Upload Windows desktop smoke diagnostics
        if: failure() && matrix.os == 'windows'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v8os-desktop-smoke-diagnostics-${{ matrix.id }}
          path: desktop-smoke-diagnostics/**
          if-no-files-found: ignore
          retention-days: 7
          compression-level: 0
        continue-on-error: true

      - name: Verify packaged desktop resource layout
        timeout-minutes: 5
        run: node scripts/desktop/verify-desktop-package-layout.mjs --platform "${{ matrix.id }}"

      - name: Normalize platform release assets and checksums
        timeout-minutes: 5
        run: >-
          node scripts/desktop/prepare-desktop-release-assets.mjs
          --platform "${{ matrix.id }}"
          --release-version "${{ inputs.release_version }}"
          --release-channel "${{ inputs.release_channel || 'preview' }}"
          --release-tag "${{ inputs.release_tag }}"
          --output-dir apps/v8-agent-os-shell/desktop-release-assets

      - name: Upload desktop platform artifacts
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v8os-desktop-${{ matrix.id }}
          path: apps/v8-agent-os-shell/desktop-release-assets/**
          if-no-files-found: error
          retention-days: 7
          compression-level: 0

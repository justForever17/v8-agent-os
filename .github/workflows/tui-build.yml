name: TUI npm package
on:
  workflow_dispatch:
  workflow_call:
  push:
    branches: [main]
    paths:
      - 'apps/v8-agent-os-tui/**'
      - 'apps/v8-agent-os-cli/**'
      - 'packages/session-realtime/**'
      - 'scripts/release/**'
      - 'release-manifest.json'
      - '.github/workflows/tui-build.yml'
  pull_request:
    paths:
      - 'apps/v8-agent-os-tui/**'
      - 'apps/v8-agent-os-cli/**'
      - 'packages/session-realtime/**'
      - 'scripts/release/**'
      - 'release-manifest.json'
      - '.github/workflows/tui-build.yml'
permissions:
  contents: read
jobs:
  npm-package:
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7
        with:
          python-version: '3.11'
      - name: Build and test the actual TUI
        run: |
          npm ci --prefix apps/v8-agent-os-tui --ignore-scripts
          npm run typecheck --prefix apps/v8-agent-os-tui
          npm test --prefix apps/v8-agent-os-tui
          npm run build --prefix apps/v8-agent-os-tui
      - name: Pack the versioned public archive
        run: node scripts/release/pack-tui-release.mjs --output out/tui --source-commit "$GITHUB_SHA"
      - name: Verify linear reader with a synthetic canonical stream
        working-directory: apps/v8-agent-os-tui
        run: |
          node node_modules/esbuild/bin/esbuild tests/reader_stream_fixture.mts --bundle --platform=node --format=esm --target=node22 --packages=external --outfile=.artifacts/reader-stream-fixture.mjs
          python tests/reader_stream_pty.py --node "$(command -v node)" --entry .artifacts/reader-stream-fixture.mjs
      - name: Install exact tarball and exercise the installed terminal
        shell: bash
        run: |
          set -euo pipefail
          archives=(out/tui/V8OS-TUI-*.tgz)
          [[ ${#archives[@]} == 1 && -f "${archives[0]}" ]]
          node - "${archives[0]}" <<'NODE'
          const cp = require('node:child_process');
          const archive = process.argv[2];
          const pkg = JSON.parse(cp.execFileSync('tar', ['-xzf', archive, '-O', 'package/package.json'], { encoding: 'utf8' }));
          if (pkg.name !== '@v8-agent-os/v8-agent-os') throw new Error(`unexpected TUI package: ${pkg.name}`);
          if (pkg.bin?.v8os) throw new Error('TUI package must not replace the server CLI v8os command');
          if (pkg.bin?.['v8os-tui'] !== 'bin/v8os-tui.mjs') throw new Error('missing v8os-tui entrypoint');
          NODE
          npm install --global --prefix "$RUNNER_TEMP/tui-prefix" --ignore-scripts --no-audit --no-fund "${archives[0]}"
          installed=$(find "$RUNNER_TEMP/tui-prefix/lib/node_modules" -name "v8os-tui.mjs" | head -n 1)
          node "$installed" --help
          python apps/v8-agent-os-tui/tests/terminal_pty.py --node "$(command -v node)" --bin "$installed" --state "$RUNNER_TEMP/tui-state"
          python -m pip install pyte==0.8.2 wcwidth==0.8.3
          python apps/v8-agent-os-tui/tests/command_suggestions_pty.py --node "$(command -v node)" --bin "$installed" --evidence "$RUNNER_TEMP/tui-command-evidence"
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '20.0.0'
      - name: Preserve Node20 CLI and reject interactive TUI before renderer import
        shell: bash
        run: |
          set -euo pipefail
          node apps/v8-agent-os-cli/bin/v8os.mjs --help
          installed=$(find "$RUNNER_TEMP/tui-prefix/lib/node_modules" -name "v8os-tui.mjs" | head -n 1)
          python apps/v8-agent-os-tui/tests/terminal_pty.py --node "$(command -v node)" --bin "$installed" --state "$RUNNER_TEMP/tui-node20-state" --expect-unsupported-node
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        with:
          name: v8os-tui-npm
          path: out/tui/V8OS-TUI-*.tgz
          if-no-files-found: error

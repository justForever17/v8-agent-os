name: phone-build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: Target platform
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
  push:
    tags:
      - "v8-os-phone-v*"

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/v8-agent-os-phone
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/v8-agent-os-phone/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Export Android bundle snapshot
        run: npx expo export --platform android --output-dir dist-android

      - name: Build Android APK
        run: >
          eas build
          --local
          --non-interactive
          --platform android
          --profile preview
          --output ./app-release.apk

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: phone-release-apk
          path: apps/v8-agent-os-phone/app-release.apk

  release:
    if: startsWith(github.ref, 'refs/tags/v8-os-phone-v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Download APK artifact
        uses: actions/download-artifact@v4
        with:
          name: phone-release-apk
          path: .

      - name: Prepare release assets
        shell: bash
        run: |
          set -euo pipefail
          VERSION="${GITHUB_REF_NAME#v8-os-phone-v}"
          APK_NAME="V8OS-Phone-${VERSION}-android-preview.apk"
          mv app-release.apk "$APK_NAME"
          sha256sum "$APK_NAME" > SHA256SUMS.txt
          node scripts/release/generate-release-notes.mjs \
            --product phone \
            --tag "$GITHUB_REF_NAME" \
            --channel preview \
            --out RELEASE_NOTES.md
          cat SHA256SUMS.txt

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: RELEASE_NOTES.md
          files: |
            V8OS-Phone-*-android-preview.apk
            SHA256SUMS.txt

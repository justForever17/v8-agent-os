appId: com.v8agentos.desktop.preview
productName: V8 Agent OS
artifactName: V8-Agent-OS-${version}-${os}-${arch}.${ext}
asar: true
directories:
  output: dist/release
toolsets:
  appimage: "1.0.3"
files:
  - assets/**/*
  - electron/**/*
  - lib/**/*
  - scripts/**/*
  - package.json
extraResources:
  - from: ../../release-manifest.json
    to: v8os/release-manifest.json
  - from: ../../apps/v8-agent-os-cli
    to: v8os/apps/v8-agent-os-cli
    filter:
      - "**/*"
      - "!node_modules/**"
      - "!dist/**"
      - "!coverage/**"
  - from: ../../apps/v8-agent-os-engine
    to: v8os/apps/v8-agent-os-engine
    filter:
      - "**/*"
      - "!.venv/**"
      - "!**/__pycache__/**"
      - "!.pytest_cache/**"
      - "!workspace/**"
      - "!tmp/**"
      - "!reports/**"
      - "!native/**/target/**"
      - "!*.db"
      - "!*.log"
  - from: ./node_modules/npm
    to: v8os/apps/v8-agent-os-engine/.plugin-node-runtime/npm
    filter:
      - "**/*"
  - from: ./node_modules/npm/node_modules
    to: v8os/apps/v8-agent-os-engine/.plugin-node-runtime/npm/node_modules
    filter:
      - "**/*"
  - from: ../../apps/v8-agent-os-admin
    to: v8os/apps/v8-agent-os-admin
    filter:
      - "**/*"
      - "!.next/dev/**"
      - "!.next/cache/**"
      - "!.next/diagnostics/**"
      - "!logs/**"
      - "!cache/**"
      - "!node_modules/.cache/**"
      - "!node_modules/**/.cache/**"
      - "!*.log"
  - from: ../../apps/v8-agent-os-web
    to: v8os/apps/v8-agent-os-web
    filter:
      - "**/*"
      - "!.next/dev/**"
      - "!.next/cache/**"
      - "!.next/diagnostics/**"
      - "!logs/**"
      - "!cache/**"
      - "!node_modules/.cache/**"
      - "!node_modules/**/.cache/**"
      - "!*.log"
  - from: ../../apps/v8-agent-os-desktop-pet
    to: v8os/apps/v8-agent-os-desktop-pet
    filter:
      - "**/*"
      - "!node_modules/**"
      - "!node_modules/.cache/**"
      - "!node_modules/**/.cache/**"
      - "!dist/**/*.map"
      - "!logs/**"
      - "!*.log"
  - from: ../../apps/v8-agent-os-shell/scripts
    to: v8os/apps/v8-agent-os-shell/scripts
    filter:
      - electron-launcher.mjs
      - command_runtime_probe.py
      - feature_pack_runtime_probe.py
      - launch-desktop-pet.mjs
      - launch-shell.mjs
      - spawn-detached-electron.mjs
  - from: ../../packages
    to: v8os/packages
    filter:
      - "**/*"
      - "!**/node_modules/**"
      - "!**/dist/**"
  - from: ../../scripts
    to: v8os/scripts
    filter:
      - "**/*"
      - "!*.log"
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
        - arm64
nsis:
  include: assets/windows-installer.nsh
  oneClick: false
  perMachine: false
  allowElevation: true
  selectPerMachineByDefault: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: V8 Agent OS
mac:
  icon: assets/icon.icns
  category: public.app-category.developer-tools
  minimumSystemVersion: "12.3"
  extendInfo:
    NSMicrophoneUsageDescription: V8 Agent OS uses the microphone only when you start voice capture.
    NSCameraUsageDescription: V8 Agent OS uses the camera only when you start a camera capture.
    NSScreenCaptureUsageDescription: V8 Agent OS uses screen capture only when you start desktop visual capture.
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  icon: assets/icon.png
  category: Development
  maintainer: V8 Agent OS <justforever17@users.noreply.github.com>
  syncDesktopName: true
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
deb:
  appArmorProfile: electron/apparmor-profile
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - libatspi2.0-0
    - libuuid1
    - libsecret-1-0
    - at-spi2-core
    - gir1.2-atspi-2.0
    - libgirepository-1.0-1
    - libcairo2
    - xdotool
    - wmctrl
    - xclip
    - xsel
    - gnome-keyring
    - libpam-gnome-keyring

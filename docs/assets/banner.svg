<svg width="800" height="180" viewBox="0 0 800 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <rect width="800" height="180" fill="#000000"/>
  <defs>
    <pattern id="grid" width="20" height="20" patternUnits="userSpaceOnUse">
      <path d="M 20 0 L 0 0 0 20" fill="none" stroke="#ffffff" stroke-opacity="0.06" stroke-width="1"/>
      <circle cx="20" cy="20" r="1" fill="#ffffff" fill-opacity="0.1" />
    </pattern>
    <linearGradient id="textGrad" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff" />
      <stop offset="100%" stop-color="#666666" />
    </linearGradient>
    <linearGradient id="glow" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#000000" stop-opacity="0" />
    </linearGradient>
  </defs>
  
  <!-- Base Grid Background -->
  <rect width="800" height="180" fill="url(#grid)"/>
  
  <!-- Ambient Top Glow -->
  <rect width="800" height="60" fill="url(#glow)"/>
  
  <!-- Hard-Surface Design Elements -->
  <path d="M 0 179 L 800 179" stroke="#333333" stroke-width="1" stroke-dasharray="2 4"/>
  <path d="M 400 0 L 400 180" stroke="#ffffff" stroke-width="1" stroke-opacity="0.03"/>
  <path d="M 50 150 L 50 160 L 60 160" stroke="#444444" stroke-width="1" fill="none"/>
  <path d="M 750 150 L 750 160 L 740 160" stroke="#444444" stroke-width="1" fill="none"/>
  <path d="M 50 30 L 50 20 L 60 20" stroke="#444444" stroke-width="1" fill="none"/>
  <path d="M 750 30 L 750 20 L 740 20" stroke="#444444" stroke-width="1" fill="none"/>

  <g font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, Helvetica, Arial, sans-serif">
    <text x="400" y="105" font-size="64" font-weight="900" fill="url(#textGrad)" text-anchor="middle" letter-spacing="4">V8 AGENT OS</text>
    <text x="400" y="145" font-family="'Consolas', 'Courier New', monospace" font-size="13" font-weight="400" fill="#777777" text-anchor="middle" letter-spacing="10">THE GLOBAL GOVERNANCE RUNTIME</text>
  </g>
</svg>

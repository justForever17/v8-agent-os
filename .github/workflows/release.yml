name: V8OS Release

run-name: V8OS release ${{ github.ref_type == 'tag' && github.ref_name || inputs.mode }}

on:
  push:
    tags:
      - "v8-os-v*"
      - "v8-os-desktop-v*"
      - "v8-os-phone-v*"
  workflow_dispatch:
    inputs:
      mode:
        description: Validate the release plan or build it without publishing
        required: true
        default: dry-run
        type: choice
        options:
          - dry-run
          - build

permissions:
  contents: read

concurrency:
  group: v8os-release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  plan:
    name: Resolve release plan
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      version: ${{ steps.release-plan.outputs.version }}
      channel: ${{ steps.release-plan.outputs.channel }}
      tag: ${{ steps.release-plan.outputs.tag }}
      prerelease: ${{ steps.release-plan.outputs.prerelease }}
      run_builds: ${{ steps.release-plan.outputs.run_builds }}
      publish: ${{ steps.release-plan.outputs.publish }}
      desktop_enabled: ${{ steps.release-plan.outputs.desktop_enabled }}
      desktop_required: ${{ steps.release-plan.outputs.desktop_required }}
      server_enabled: ${{ steps.release-plan.outputs.server_enabled }}
      server_required: ${{ steps.release-plan.outputs.server_required }}
      tui_enabled: ${{ steps.release-plan.outputs.tui_enabled }}
      tui_required: ${{ steps.release-plan.outputs.tui_required }}
      desktop_targets_json: ${{ steps.release-plan.outputs.desktop_targets_json }}
      phone_enabled: ${{ steps.release-plan.outputs.phone_enabled }}
      phone_required: ${{ steps.release-plan.outputs.phone_required }}
      android_enabled: ${{ steps.release-plan.outputs.android_enabled }}
      android_required: ${{ steps.release-plan.outputs.android_required }}
      ios_enabled: ${{ steps.release-plan.outputs.ios_enabled }}
      ios_required: ${{ steps.release-plan.outputs.ios_required }}
      phone_platform: ${{ steps.release-plan.outputs.phone_platform }}
      phone_profile: ${{ steps.release-plan.outputs.phone_profile }}

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - id: release-plan
        name: Validate manifest and resolve products
        shell: bash
        env:
          REQUESTED_MODE: ${{ inputs.mode || 'build' }}
        run: |
          set -euo pipefail
          mode="$REQUESTED_MODE"
          args=(
            --manifest release-manifest.json
            --mode "$mode"
            --github-output "$GITHUB_OUTPUT"
          )
          if [[ "$GITHUB_REF_TYPE" == "tag" ]]; then
            args+=(--tag "$GITHUB_REF_NAME")
          fi
          node scripts/release/resolve-release-plan.mjs "${args[@]}"

  server-build:
    needs: [plan]
    if: needs.plan.outputs.run_builds == 'true' && needs.plan.outputs.server_enabled == 'true'
    uses: ./.github/workflows/server-build.yml

  tui-build:
    needs: [plan]
    if: needs.plan.outputs.run_builds == 'true' && needs.plan.outputs.tui_enabled == 'true'
    uses: ./.github/workflows/tui-build.yml

  desktop-build:
    name: Build required Desktop targets
    needs:
      - plan
    if: >-
      needs.plan.outputs.run_builds == 'true' &&
      needs.plan.outputs.desktop_enabled == 'true'
    permissions:
      contents: read
    uses: ./.github/workflows/desktop-preview.yml
    with:
      targets_json: ${{ needs.plan.outputs.desktop_targets_json }}
      platform: all
      release_version: ${{ needs.plan.outputs.version }}
      release_channel: ${{ needs.plan.outputs.channel }}
      release_tag: ${{ needs.plan.outputs.tag }}

  phone-android-build:
    name: Phone Android package
    needs:
      - plan
    if: >-
      needs.plan.outputs.run_builds == 'true' &&
      needs.plan.outputs.phone_enabled == 'true' &&
      needs.plan.outputs.android_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build Android package
        uses: ./.github/actions/build-phone-package
        with:
          platform: android
          profile: ${{ needs.plan.outputs.phone_profile }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

  phone-ios-build:
    name: Phone iOS package
    needs:
      - plan
    if: >-
      needs.plan.outputs.run_builds == 'true' &&
      needs.plan.outputs.phone_enabled == 'true' &&
      needs.plan.outputs.ios_enabled == 'true'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Build iOS package
        uses: ./.github/actions/build-phone-package
        with:
          platform: ios
          profile: ${{ needs.plan.outputs.phone_profile }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

  phone-build-contract:
    name: Verify requested Phone packages completed
    needs:
      - plan
      - phone-android-build
      - phone-ios-build
    if: >-
      always() && !cancelled() &&
      needs.plan.result == 'success' &&
      needs.plan.outputs.run_builds == 'true' &&
      needs.plan.outputs.phone_enabled == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 3
    permissions:
      contents: read

    steps:
      - name: Enforce the requested target results
        shell: bash
        env:
          BUILD_ANDROID: ${{ needs.plan.outputs.android_enabled }}
          ANDROID_RESULT: ${{ needs.phone-android-build.result }}
          BUILD_IOS: ${{ needs.plan.outputs.ios_enabled }}
          IOS_RESULT: ${{ needs.phone-ios-build.result }}
        run: |
          set -euo pipefail
          verify_target() {
            local target="$1"
            local requested="$2"
            local result="$3"
            if [[ "$requested" == "true" && "$result" != "success" ]]; then
              echo "Requested Phone target $target ended with $result" >&2
              exit 1
            fi
            if [[ "$requested" != "true" && "$result" != "skipped" ]]; then
              echo "Disabled Phone target $target unexpectedly ended with $result" >&2
              exit 1
            fi
          }
          verify_target android "$BUILD_ANDROID" "$ANDROID_RESULT"
          verify_target ios "$BUILD_IOS" "$IOS_RESULT"

  release-gate:
    name: Verify required release products
    needs:
      - plan
      - desktop-build
      - phone-build-contract
      - server-build
      - tui-build
    if: ${{ always() && !cancelled() && needs.plan.result == 'success' }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      contents: read
    outputs:
      publish_ready: ${{ steps.release-gate.outputs.publish_ready }}

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '22'
      - id: release-gate
        name: Enforce required product results
        shell: bash
        env:
          RUN_BUILDS: ${{ needs.plan.outputs.run_builds }}
          PUBLISH: ${{ needs.plan.outputs.publish }}
          DESKTOP_ENABLED: ${{ needs.plan.outputs.desktop_enabled }}
          DESKTOP_REQUIRED: ${{ needs.plan.outputs.desktop_required }}
          DESKTOP_RESULT: ${{ needs.desktop-build.result }}
          PHONE_ENABLED: ${{ needs.plan.outputs.phone_enabled }}
          PHONE_REQUIRED: ${{ needs.plan.outputs.phone_required }}
          PHONE_RESULT: ${{ needs.phone-build-contract.result }}
          SERVER_ENABLED: ${{ needs.plan.outputs.server_enabled }}
          SERVER_REQUIRED: ${{ needs.plan.outputs.server_required }}
          SERVER_RESULT: ${{ needs.server-build.result }}
          TUI_ENABLED: ${{ needs.plan.outputs.tui_enabled }}
          TUI_REQUIRED: ${{ needs.plan.outputs.tui_required }}
          TUI_RESULT: ${{ needs.tui-build.result }}
        run: |
          set -euo pipefail
          echo "publish_ready=false" >> "$GITHUB_OUTPUT"

          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          import { evaluateReleaseGate, PRODUCT_TARGETS } from './scripts/release/release-manifest.mjs';
          const products = Object.fromEntries(Object.keys(PRODUCT_TARGETS).map((name) => {
            const prefix = name.toUpperCase();
            return [name, {
              enabled: process.env[prefix + '_ENABLED'] === 'true',
              required: process.env[prefix + '_REQUIRED'] === 'true',
              result: process.env[prefix + '_RESULT'],
            }];
          }));
          const ready = evaluateReleaseGate({ runBuilds: process.env.RUN_BUILDS === 'true', publish: process.env.PUBLISH === 'true', products });
          fs.appendFileSync(process.env.GITHUB_OUTPUT, 'publish_ready=' + ready + '\n');
          NODE

  publish:
    name: Publish one V8OS release
    needs:
      - plan
      - release-gate
    if: >-
      ${{ !cancelled() &&
      needs.plan.result == 'success' &&
      needs.release-gate.result == 'success' &&
      needs.release-gate.outputs.publish_ready == 'true' }}
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
        with:
          fetch-depth: 0

      - name: Set up Node.js for trusted npm publishing
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7
        with:
          node-version: '24'

      - name: Download Server build artifact
        if: needs.plan.outputs.server_enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: v8os-server-linux-x64
          path: release-input/server

      - name: Download TUI npm artifact
        if: needs.plan.outputs.tui_enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: v8os-tui-npm
          path: release-input/tui

      - name: Download Desktop build artifacts
        if: needs.plan.outputs.desktop_enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: v8os-desktop-*
          path: release-input/desktop
          merge-multiple: true

      - name: Download portable Engine build artifacts
        if: needs.plan.outputs.server_enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          pattern: v8os-engine-*
          path: release-input/server
          merge-multiple: true

      - name: Download Android build artifact
        if: needs.plan.outputs.android_enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: phone-android-package
          path: release-input/phone/android

      - name: Download iOS build artifact
        if: needs.plan.outputs.ios_enabled == 'true'
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8
        with:
          name: phone-ios-package
          path: release-input/phone/ios

      - name: Prepare unified public release assets
        shell: bash
        run: >-
          node scripts/release/prepare-unified-release-assets.mjs
          --manifest release-manifest.json
          --tag "${{ needs.plan.outputs.tag }}"
          --source-commit "${{ github.sha }}"
          --input-dir release-input
          --output-dir release-assets

      - name: Verify public release surface
        shell: bash
        run: |
          set -euo pipefail
          test -f release-assets/SHA256SUMS.txt
          while IFS= read -r asset; do
            case "$asset" in
              V8-Agent-OS-*|V8OS-Phone-*|V8OS-Server-*|V8OS-Engine-*|V8OS-TUI-*.tgz|SHA256SUMS.txt) ;;
              *) echo "Unexpected public release asset: $asset" >&2; exit 1 ;;
            esac
          done < <(find release-assets -maxdepth 1 -type f -printf '%f\n' | sort)

      - name: Generate release notes
        shell: bash
        env:
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_VERSION: ${{ needs.plan.outputs.version }}
          RELEASE_CHANNEL: ${{ needs.plan.outputs.channel }}
        run: |
          set -euo pipefail
          product=all
          case "$RELEASE_TAG" in
            v8-os-desktop-v*) product=desktop ;;
            v8-os-phone-v*) product=phone ;;
          esac
          mkdir -p release-work
          node scripts/release/generate-release-notes.mjs \
            --manifest release-manifest.json \
            --product "$product" \
            --version "$RELEASE_VERSION" \
            --tag "$RELEASE_TAG" \
            --channel "$RELEASE_CHANNEL" \
            --out release-work/RELEASE_NOTES.md

      - name: Publish verified assets without replacing existing files
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.plan.outputs.tag }}
          RELEASE_PRERELEASE: ${{ needs.plan.outputs.prerelease }}
        run: >-
          node scripts/release/publish-unified-release.mjs
          --repo "$GITHUB_REPOSITORY" --tag "$RELEASE_TAG"
          --source-commit "$GITHUB_SHA" --prerelease "$RELEASE_PRERELEASE"
          --directory release-assets --notes release-work/RELEASE_NOTES.md

      - name: Publish verified TUI package to npm via OIDC Trusted Publishing
        if: needs.plan.outputs.tui_enabled == 'true'
        shell: bash
        run: |
          set -euo pipefail
          archives=(./release-assets/V8OS-TUI-*.tgz)
          if [[ ${#archives[@]} != 1 || ! -f "${archives[0]}" ]]; then
            echo "::error::Expected exactly one verified TUI package archive for npm publication"
            exit 1
          fi
          tarball="${archives[0]}"
          pkg_name=$(node -e "const cp=require('node:child_process'); const out=cp.execFileSync('tar',['-xzf','$tarball','-O','package/package.json'],{encoding:'utf8'}); console.log(JSON.parse(out).name);")
          pkg_ver=$(node -e "const cp=require('node:child_process'); const out=cp.execFileSync('tar',['-xzf','$tarball','-O','package/package.json'],{encoding:'utf8'}); console.log(JSON.parse(out).version);")
          node --input-type=module - "${{ needs.plan.outputs.version }}" "$GITHUB_SHA" <<'NODE'
          import { verifyEngineReleaseAssets } from './scripts/release/prepare-unified-release-assets.mjs';
          import fs from 'node:fs';
          import path from 'node:path';
          const [version, sourceCommit] = process.argv.slice(2);
          const targets = ['linux-x64', 'windows-x64', 'windows-arm64', 'macos-x64', 'macos-arm64'];
          for (const target of targets) {
            const archive = path.resolve(`release-assets/V8OS-Engine-${version}-${target}.tar.gz`);
            const manifest = path.resolve(`release-assets/V8OS-Engine-${version}-${target}.json`);
            if (!fs.existsSync(archive) || !fs.existsSync(manifest)) throw new Error(`Missing required portable Engine pair for ${target}`);
            verifyEngineReleaseAssets({ archive, manifest, version, target, sourceCommit });
          }
          NODE
          echo "Verifying $pkg_name@$pkg_ver against npm registry..."

          published=$(npm view "$pkg_name@$pkg_ver" version 2>/dev/null || true)
          if [[ "$published" == "$pkg_ver" ]]; then
            echo "::error::Version $pkg_ver of $pkg_name is already published on npmjs.org; bump the package version before publishing."
            exit 1
          fi
          echo "Publishing $tarball to npm via OIDC Trusted Publishing with SLSA Provenance..."
          npm publish "./${tarball#./}" --access public --tag latest --provenance

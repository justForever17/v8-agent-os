appId: com.v8agentos.desktop.preview
productName: V8 Agent OS
artifactName: V8-Agent-OS-${version}-${os}-${arch}.${ext}
asar: true
directories:
  output: dist/release
files:
  - assets/**/*
  - electron/**/*
  - lib/**/*
  - scripts/**/*
  - package.json
extraResources:
  - from: ../../apps/v8-agent-os-cli
    to: v8os/apps/v8-agent-os-cli
    filter:
      - "**/*"
      - "!node_modules/**"
      - "!dist/**"
      - "!coverage/**"
  - from: ../../apps/v8-agent-os-engine
    to: v8os/apps/v8-agent-os-engine
    filter:
      - "**/*"
      - "!.venv/**"
      - "!**/__pycache__/**"
      - "!.pytest_cache/**"
      - "!workspace/**"
      - "!tmp/**"
      - "!reports/**"
      - "!native/**/target/**"
      - "!*.db"
      - "!*.log"
  - from: ../../apps/v8-agent-os-admin
    to: v8os/apps/v8-agent-os-admin
    filter:
      - "**/*"
      - "!.next/dev/**"
      - "!.next/cache/**"
      - "!.next/diagnostics/**"
      - "!logs/**"
      - "!cache/**"
      - "!node_modules/.cache/**"
      - "!node_modules/**/.cache/**"
      - "!*.log"
  - from: ../../apps/v8-agent-os-web
    to: v8os/apps/v8-agent-os-web
    filter:
      - "**/*"
      - "!.next/dev/**"
      - "!.next/cache/**"
      - "!.next/diagnostics/**"
      - "!logs/**"
      - "!cache/**"
      - "!node_modules/.cache/**"
      - "!node_modules/**/.cache/**"
      - "!*.log"
  - from: ../../apps/v8-agent-os-desktop-pet
    to: v8os/apps/v8-agent-os-desktop-pet
    filter:
      - "**/*"
      - "!node_modules/.cache/**"
      - "!node_modules/**/.cache/**"
      - "!dist/**/*.map"
      - "!logs/**"
      - "!*.log"
  - from: ../../packages
    to: v8os/packages
    filter:
      - "**/*"
      - "!**/node_modules/**"
      - "!**/dist/**"
  - from: ../../scripts
    to: v8os/scripts
    filter:
      - "**/*"
      - "!*.log"
win:
  icon: assets/icon.ico
  target:
    - target: nsis
      arch:
        - x64
nsis:
  oneClick: false
  perMachine: false
  allowElevation: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true
  shortcutName: V8 Agent OS
mac:
  icon: assets/icon.icns
  category: public.app-category.developer-tools
  target:
    - target: dmg
      arch:
        - x64
        - arm64
linux:
  icon: assets/icon.png
  category: Development
  target:
    - target: AppImage
      arch:
        - x64
        - arm64
    - target: deb
      arch:
        - x64
        - arm64
deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils
    - at-spi2-core
    - xdotool
    - wmctrl
    - xclip
    - xsel

name: Phone Build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: Target platform
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all

permissions:
  contents: read

concurrency:
  group: phone-build-${{ github.workflow }}-${{ github.ref }}-${{ inputs.platform }}
  cancel-in-progress: true

jobs:
  build-android:
    name: Phone Android package
    if: >-
      inputs.platform == 'android' || inputs.platform == 'all'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment: release
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build Android package
        uses: ./.github/actions/build-phone-package
        with:
          platform: android
          profile: ${{ inputs.profile || 'preview' }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

  build-ios:
    name: Phone iOS package
    if: >-
      inputs.platform == 'ios' || inputs.platform == 'all'
    runs-on: macos-latest
    timeout-minutes: 60
    environment: release
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Build iOS package
        uses: ./.github/actions/build-phone-package
        with:
          platform: ios
          profile: ${{ inputs.profile || 'preview' }}
          expo-token: ${{ secrets.EXPO_TOKEN }}

name: Desktop Preview Build

on:
  workflow_dispatch:
  push:
    tags:
      - "v8-os-desktop-v*"

permissions:
  contents: write

jobs:
  windows-preview:
    name: Windows unsigned preview installer
    runs-on: windows-latest
    timeout-minutes: 90

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: |
            apps/v8-agent-os-admin/package-lock.json
            apps/v8-agent-os-web/package-lock.json
            apps/v8-agent-os-desktop-pet/package-lock.json
            apps/v8-agent-os-shell/package-lock.json

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install Admin dependencies
        shell: pwsh
        working-directory: apps/v8-agent-os-admin
        run: npm ci --include=dev --workspaces=false

      - name: Install Web dependencies
        shell: pwsh
        working-directory: apps/v8-agent-os-web
        run: npm ci --include=dev --workspaces=false

      - name: Install desktop pet dependencies
        shell: pwsh
        working-directory: apps/v8-agent-os-desktop-pet
        run: npm ci --include=dev --workspaces=false

      - name: Install Shell dependencies
        shell: pwsh
        working-directory: apps/v8-agent-os-shell
        run: npm ci --include=dev --workspaces=false

      - name: Prepare embedded Engine Python runtime
        shell: pwsh
        run: |
          python -m venv apps/v8-agent-os-engine/.venv
          apps/v8-agent-os-engine/.venv/Scripts/python.exe -m pip install --upgrade pip
          apps/v8-agent-os-engine/.venv/Scripts/python.exe -m pip install -r apps/v8-agent-os-engine/requirements.txt
          $browserPath = Join-Path (Resolve-Path "apps/v8-agent-os-engine").Path ".playwright-browsers"
          New-Item -ItemType Directory -Force -Path $browserPath | Out-Null
          $env:PLAYWRIGHT_BROWSERS_PATH = $browserPath
          apps/v8-agent-os-engine/.venv/Scripts/python.exe -m playwright install chromium

      - name: Build Admin and Web production bundles
        shell: pwsh
        run: |
          node scripts/run-next-with-managed-auth.mjs --app admin --mode build --port 9528
          node scripts/run-next-with-managed-auth.mjs --app web --mode build --port 9527

      - name: Build desktop pet
        shell: pwsh
        working-directory: apps/v8-agent-os-desktop-pet
        run: |
          npm exec -- vite --version
          npm exec -- esbuild --version
          npm run build

      - name: Verify desktop runtime payload
        shell: pwsh
        run: node apps/v8-agent-os-shell/tests/scripts/verify_desktop_release_runtime.mjs

      - name: Shell release contract tests
        shell: pwsh
        run: npm --prefix apps/v8-agent-os-shell test

      - name: Build unsigned Windows desktop preview
        shell: pwsh
        run: npm --prefix apps/v8-agent-os-shell run dist:win

      - name: Installed desktop smoke
        shell: pwsh
        timeout-minutes: 8
        run: |
          $shellExe = Get-ChildItem "apps/v8-agent-os-shell/dist/release" -Recurse -File -Filter "V8 Agent OS.exe" | Select-Object -First 1
          if (-not $shellExe) { throw "No unpacked Shell executable found in apps/v8-agent-os-shell/dist/release" }
          node apps/v8-agent-os-shell/tests/scripts/run_desktop_install_smoke.mjs --shell-exe "$($shellExe.FullName)"

      - name: Cleanup desktop smoke processes
        if: always()
        shell: pwsh
        run: |
          node apps/v8-agent-os-cli/bin/v8os.mjs stop --all
          Get-Process "V8 Agent OS" -ErrorAction SilentlyContinue | Stop-Process -Force
        continue-on-error: true

      - name: Normalize desktop artifact names
        shell: pwsh
        run: |
          $outDir = "apps/v8-agent-os-shell/dist/release"
          if ($env:GITHUB_REF_NAME -match '^v8-os-desktop-v(.+)$') {
            $releaseVersion = "preview-$($Matches[1])"
          } else {
            $releaseVersion = "preview-$env:GITHUB_RUN_NUMBER"
          }
          $exe = Get-ChildItem $outDir -File -Filter "*.exe" | Select-Object -First 1
          $zip = Get-ChildItem $outDir -File -Filter "*.zip" | Select-Object -First 1
          if (-not $exe) { throw "No NSIS installer found in $outDir" }
          if (-not $zip) { throw "No zip package found in $outDir" }
          Rename-Item -LiteralPath $exe.FullName -NewName "V8-Agent-OS-$releaseVersion-win-x64-setup.exe" -Force
          Rename-Item -LiteralPath $zip.FullName -NewName "V8-Agent-OS-$releaseVersion-win-x64.zip" -Force

      - name: Generate SHA256 checksums
        shell: pwsh
        run: |
          $outDir = "apps/v8-agent-os-shell/dist/release"
          $files = Get-ChildItem $outDir -File | Where-Object { $_.Extension -in ".exe", ".zip" }
          if (-not $files) { throw "No desktop preview artifacts found in $outDir" }
          $lines = foreach ($file in $files) {
            $hash = Get-FileHash $file.FullName -Algorithm SHA256
            "$($hash.Hash)  $($file.Name)"
          }
          $lines | Set-Content -Path "$outDir/SHA256SUMS.txt" -Encoding utf8
          Get-Content "$outDir/SHA256SUMS.txt"

      - name: Generate desktop release notes
        if: startsWith(github.ref, 'refs/tags/v8-os-desktop-v')
        shell: pwsh
        run: |
          node scripts/release/generate-release-notes.mjs `
            --product desktop `
            --tag "$env:GITHUB_REF_NAME" `
            --channel preview `
            --out "apps/v8-agent-os-shell/dist/release/RELEASE_NOTES.md"

      - name: Upload desktop preview artifacts
        uses: actions/upload-artifact@v4
        with:
          name: v8os-desktop-preview-windows
          path: |
            apps/v8-agent-os-shell/dist/release/*.exe
            apps/v8-agent-os-shell/dist/release/*.zip
            apps/v8-agent-os-shell/dist/release/SHA256SUMS.txt
            apps/v8-agent-os-shell/dist/release/RUNTIME_PROBE.json
          if-no-files-found: error

      - name: Create GitHub release
        if: startsWith(github.ref, 'refs/tags/v8-os-desktop-v')
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: false
          body_path: apps/v8-agent-os-shell/dist/release/RELEASE_NOTES.md
          files: |
            apps/v8-agent-os-shell/dist/release/*.exe
            apps/v8-agent-os-shell/dist/release/*.zip
            apps/v8-agent-os-shell/dist/release/SHA256SUMS.txt
            apps/v8-agent-os-shell/dist/release/RUNTIME_PROBE.json

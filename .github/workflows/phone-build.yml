name: phone-build

on:
  workflow_dispatch:
    inputs:
      profile:
        description: EAS build profile
        required: true
        default: preview
        type: choice
        options:
          - development
          - preview
          - production
      platform:
        description: Target platform
        required: true
        default: android
        type: choice
        options:
          - android
          - ios
          - all
  push:
    tags:
      - "phone-v*"

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/v8-agent-os-phone
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: apps/v8-agent-os-phone/package-lock.json

      - name: Setup Expo and EAS
        uses: expo/expo-github-action@v8
        with:
          eas-version: latest
          token: ${{ secrets.EXPO_TOKEN }}

      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Export Android bundle snapshot
        run: npx expo export --platform android --output-dir dist-android

      - name: Start EAS build
        run: >
          eas build
          --non-interactive
          --platform ${{ github.event_name == 'push' && 'all' || inputs.platform }}
          --profile ${{ github.event_name == 'push' && 'production' || inputs.profile }}

  release:
    if: startsWith(github.ref, 'refs/tags/phone-v')
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true

name: Native Sandbox Host Contract

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/sandbox-host-contract.yml"
      - "apps/v8-agent-os-engine/native/v8-sandbox-host/**"
      - "apps/v8-agent-os-engine/core/engineering_sandbox/platform_driver.py"
      - "scripts/desktop/build-sandbox-host.mjs"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/sandbox-host-contract.yml"
      - "apps/v8-agent-os-engine/native/v8-sandbox-host/**"
      - "apps/v8-agent-os-engine/core/engineering_sandbox/platform_driver.py"
      - "scripts/desktop/build-sandbox-host.mjs"

permissions:
  contents: read

concurrency:
  group: sandbox-host-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  native-contract:
    name: ${{ matrix.name }} native host
    runs-on: ${{ matrix.os }}
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            os: windows-latest
          - name: Linux x64
            os: ubuntu-latest
          - name: macOS
            os: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Build and verify native host
        shell: bash
        run: |
          cargo test --locked --manifest-path apps/v8-agent-os-engine/native/v8-sandbox-host/Cargo.toml
          node scripts/desktop/build-sandbox-host.mjs --force
          node scripts/desktop/build-sandbox-host.mjs --check

      - name: Check Windows ARM64 source compatibility
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          rustup target add aarch64-pc-windows-msvc
          cargo check --locked --target aarch64-pc-windows-msvc --manifest-path apps/v8-agent-os-engine/native/v8-sandbox-host/Cargo.toml

